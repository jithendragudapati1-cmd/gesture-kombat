<!-- Supabase → Authentication → Emails → "Reset Password". Subject: Your Gesture Kombat reset code: {{ .Token }} -->
<div style="background:#070302;padding:32px 12px;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#120806;border:1px solid #7a3a24;border-top:3px solid #ff5a2a">
    <tr><td style="padding:32px 32px 8px;text-align:center">
      <div style="font:italic 900 40px/0.9 Impact,'Arial Narrow',sans-serif;color:#eef1f4">GESTURE</div>
      <div style="font:italic 900 40px/0.9 Impact,'Arial Narrow',sans-serif;color:#ff5426">KOMBAT</div>
    </td></tr>
    <tr><td style="padding:20px 32px;color:#e8dcd6;font-size:16px;line-height:1.6;text-align:center">
      <p style="margin:0 0 8px">Enter this code in the game to reset your password:</p>
      <div style="display:inline-block;margin:8px 0 18px;padding:14px 26px;background:#05090d;border:1px solid #ff5a2a;color:#ffd36b;font:bold 36px/1 'Courier New',monospace;letter-spacing:10px">{{ .Token }}</div>
      <p style="margin:0 0 6px;font-size:14px;color:#b9a49a">The code expires in 1 hour. Then you'll type your new password twice.</p>
      <p style="margin:0;font-size:13px;color:#9a8a83">If you didn't ask for this, ignore this email. Your password stays the same.</p>
    </td></tr>
  </table>
</div>
